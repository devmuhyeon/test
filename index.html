<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>고용24 PC 공통 데이트피커</title>
    <link rel="stylesheet" href="common.css?v=calendar-states">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="jquery-ui.css">
    <style>
        .datepicker_demo { max-width: 720px; margin: 48px auto; padding: 0 16px; }
        .datepicker_demo_list { display: flex; flex-direction: column; gap: 28px; margin-top: 24px; }
        .datepicker_demo_item { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
        .datepicker_demo_item h2 { margin: 0; font-size: 16px; line-height: 1.5; }
        .datepicker_demo_item > .box_datepicker { width: 360px; max-width: 100%; }
        .datepicker_demo_item > #w24dp_date_count { width: 80px; padding: 4px 8px; }
    </style>
    <script src="jquery-3.6.1.min.js" defer></script>
    <script src="common.js?v=calendar-states" defer></script>
</head>
<body>
    <main class="datepicker_demo">
        <h1>PC 공통 데이트피커</h1>
        <form class="datepicker_demo_list">
            <div class="datepicker_demo_item">
                <h2>단일 날짜 선택</h2>
                <div class="box_table_group box_datepicker">
                    <div class="cell">
                        <span class="box_ipt">
                            <input type="text" class="input_txt" placeholder="YYYY-MM-DD">
                            <button type="button" class="btn_calendar" w24-datepicker="single"><span class="blind">달력선택</span></button>
                        </span>
                    </div>
                </div>
            </div>
            <div class="datepicker_demo_item">
                <h2>다중 날짜 선택 · 선택 월 고정</h2>
                <p>선택값 표시 예시 2026-12-05 외 3일</p>
                <div class="box_table_group box_datepicker">
                    <div class="cell">
                        <span class="box_ipt">
                            <input type="text" class="input_txt" placeholder="YYYY-MM-DD">
                            <button type="button" class="btn_calendar" w24-datepicker="multiple" data-dp-locked-month="2026-12" data-dp-value="2026-12-05,2026-12-08,2026-12-09,2026-12-12"><span class="blind">지정 월 내 날짜 선택</span></button>
                        </span>
                    </div>
                </div>
            </div>
            <div class="datepicker_demo_item">
                <h2>다중 날짜 선택 · 기간 제한 없음</h2>
                <div class="box_table_group box_datepicker">
                    <div class="cell">
                        <span class="box_ipt">
                            <input type="text" class="input_txt" placeholder="YYYY-MM-DD">
                            <button type="button" class="btn_calendar" w24-datepicker="multiple"><span class="blind">여러 날짜 선택</span></button>
                        </span>
                    </div>
                </div>
            </div>
            <div class="datepicker_demo_item" data-dp-scope>
                <h2>날짜 선택 · 주말 제외, 공휴일 추가·제외</h2>
                <div class="box_table_group box_datepicker">
                    <div class="cell">
                        <span class="box_ipt">
                            <input type="text" class="input_txt" placeholder="YYYY-MM-DD" name="workDates">
                            <button type="button" class="btn_calendar" w24-datepicker="workday" data-dp-count-target="#w24dp_date_count" data-dp-holidays="2026-12-25" data-dp-holidays-add="2026-12-24,2026-12-31" data-dp-holidays-exclude="2026-12-24" data-dp-value="2026-12-29"><span class="blind">날짜 선택</span></button>
                        </span>
                    </div>
                </div>
                <label for="w24dp_date_count">날짜 개수</label>
                <input id="w24dp_date_count" type="text" class="input_txt" name="workdayCount">
            </div>
            <div class="datepicker_demo_item">
                <h2>월 선택</h2>
                <div class="box_table_group box_datepicker">
                    <div class="cell">
                        <span class="box_ipt">
                            <input type="text" class="input_txt" placeholder="YYYY-MM">
                            <button type="button" class="btn_calendar" w24-datepicker="month" data-dp-min-year="1950" data-dp-max-year="2050"><span class="blind">월 선택</span></button>
                        </span>
                    </div>
                </div>
            </div>
            <div class="datepicker_demo_item">
                <h2>기간 월 선택 · 시작월과 종료월</h2>
                <div class="box_table_group box_datepicker flx-dir-col">
                    <div class="cell">
                        <span class="box_ipt">
                            <input type="text" class="input_txt" name="startSchoolList" title="재학기간 시작날짜" placeholder="YYYY-MM">
                            <button type="button" class="btn_calendar" w24-datepicker="month"><span class="blind">달력선택</span></button>
                        </span>
                    </div>
                    <div class="cell flx-dir-row" style="flex-direction: row;">
                        <i class="date_line b1_r" aria-hidden="true">~</i>
                        <span class="box_ipt">
                            <input type="text" class="input_txt" name="endSchoolList" title="재학기간 종료날짜" placeholder="YYYY-MM">
                            <button type="button" class="btn_calendar" w24-datepicker="month"><span class="blind">달력선택</span></button>
                        </span>
                    </div>
                </div>
            </div>
            <div class="datepicker_demo_item">
                <h2>기간 날짜 선택 · 시작일과 종료일</h2>
                <div class="box_table_group box_datepicker flx-dir-col">
                    <div class="cell">
                        <span class="box_ipt">
                            <input type="text" class="input_txt" name="startDateList" title="기간 시작날짜" placeholder="YYYY-MM-DD">
                            <button type="button" class="btn_calendar" w24-datepicker="single"><span class="blind">달력선택</span></button>
                        </span>
                    </div>
                    <div class="cell flx-dir-row" style="flex-direction: row;">
                        <i class="date_line b1_r" aria-hidden="true">~</i>
                        <span class="box_ipt">
                            <input type="text" class="input_txt" name="endDateList" title="기간 종료날짜" placeholder="YYYY-MM-DD">
                            <button type="button" class="btn_calendar" w24-datepicker="single"><span class="blind">달력선택</span></button>
                        </span>
                    </div>
                </div>
            </div>
            <div class="datepicker_demo_item">
                <h2 lang="en">English example</h2>
                <div class="box_table_group box_datepicker">
                    <div class="cell">
                        <span class="box_ipt">
                            <input type="text" class="input_txt" placeholder="YYYY-MM-DD">
                            <button type="button" class="btn_calendar" w24-datepicker="single" data-dp-lang="en"><span class="blind">Choose date</span></button>
                        </span>
                    </div>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
