<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>고용24 PC 공통 데이트피커</title>
    <link rel="stylesheet" href="datepicker.css">
    <script src="jquery-3.6.1.min.js" defer></script>
    <script src="datepicker.js" defer></script>
</head>
<body>
    <main style="max-width:720px;margin:48px auto;padding:0 16px">
        <h1>PC 공통 데이트피커</h1>
        <form>
            <p>단일 날짜 선택</p>
            <button type="button" w24-datepicker="day" data-dp-name="visitDate"><span class="blind">방문일 선택</span></button>
            <p>다중 날짜 선택 · 선택 월 고정</p>
            <button type="button" w24-datepicker="multi" data-dp-name="limitedDates" data-dp-locked-month="2026-12" data-dp-value="2026-12-05,2026-12-08,2026-12-09,2026-12-12"><span class="blind">지정 월 내 날짜 선택</span></button>
            <p>다중 날짜 선택 · 기간 제한 없음</p>
            <button type="button" w24-datepicker="multi" data-dp-name="visitDates"><span class="blind">여러 날짜 선택</span></button>
            <p>근무일 선택 · 주말 제외, 공휴일 추가·제외</p>
            <button type="button" w24-datepicker="day" data-dp-name="workDate" data-dp-disable-weekends="true" data-dp-holidays="2026-12-25" data-dp-holidays-add="2026-12-24,2026-12-31" data-dp-holidays-exclude="2026-12-24" data-dp-value="2026-12-29"><span class="blind">근무일 선택</span></button>
            <p>월 선택</p>
            <button type="button" w24-datepicker="month" data-dp-name="visitMonth"><span class="blind">월 선택</span></button>
            <p lang="en">English example</p>
            <button type="button" w24-datepicker="day" data-dp-lang="en" data-dp-name="englishDate"><span class="blind">Choose date</span></button>
        </form>
    </main>
</body>
</html>
