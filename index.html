<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>고용24 PC 공통 데이트피커</title>
    <link rel="stylesheet" href="datepicker.css">
    <script src="jquery-3.6.1.min.js" defer></script>
    <script src="datepicker.js" defer></script>
</head>
<body>
    <main style="max-width:720px;margin:48px auto;padding:0 16px">
        <h1>PC 공통 데이트피커</h1>
        <form>
            <p>단일 날짜 선택</p>
            <button type="button" w24-datepicker="day" data-dp-name="visitDate">방문일 선택</button>
            <p>다중 날짜 선택 · 선택 월 고정</p>
            <button type="button" w24-datepicker="multi" data-dp-name="limitedDates" data-dp-locked-month="2026-12" data-dp-value="2026-12-05,2026-12-08,2026-12-09,2026-12-12">지정 월 내 날짜 선택</button>
            <p>다중 날짜 선택 · 기간 제한 없음</p>
            <button type="button" w24-datepicker="multi" data-dp-name="visitDates">여러 날짜 선택</button>
            <p>월 선택</p>
            <button type="button" w24-datepicker="month" data-dp-name="visitMonth">월 선택</button>
            <p lang="en">English example</p>
            <button type="button" w24-datepicker="day" data-dp-lang="en" data-dp-name="englishDate">Choose date</button>
        </form>
    </main>
</body>
</html>
